<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Vier gewinnt</title>
  <link rel="stylesheet" href="styles.css">
  <script>

/*
 *  This solution should be considered as a proof of concept – the code
 *  definitely needs some cleanup and documentation
 */
 
let state = {
  board: [
    [ '', '', '', '', '', '', '' ],
    [ '', '', '', '', '', '', '' ],
    [ '', '', '', '', '', '', '' ],
    [ '', '', '', '', '', '', '' ],
    [ '', '', '', '', '', '', '' ],
    [ '', '', '', '', '', '', '' ]
  ],
  next: 'b'
}

const SERVICE = "http://localhost:3000/api/data/c4state?api-key=c4game"


//  Initialize game
//
function initGame () {
  let board = showBoard()
  attachEventHandler(board)
}


//  Show board
// 
function showBoard () {
  let board = document.querySelector(".board")
  let status = document.querySelector("#status")

  if (status) {
    status.textContent = (state.next === 'r') ? "Turn: Red" : "Turn: Blue"
  }

  // first remove all fields
  while (board.firstChild) { board.removeChild(board.firstChild) }

  for (let row = 0; row < 6; row++) {
    for (let col = 0; col < 7; col++) {
      let wert = state.board[row][col]
      let field

      if (wert === "r") {
        field = elt("div", { class: "field", "data-col": col }, elt("div", { class: "piece red" }))
      } else if (wert === "b") {
        field = elt("div", { class: "field", "data-col": col }, elt("div", { class: "piece blue" }))
      } else {
        field = elt("div", { class: "field", "data-col": col })
      }

      board.appendChild(field)
    }
  }

  return board
}


//  Helper function for DOM manipulation
// 
function elt (type, attrs, ...children) {
  let node = document.createElement(type)
  Object.keys(attrs).forEach(key => {
    node.setAttribute(key, attrs[key])
  })
  for (let child of children) {
    if (typeof child != "string") node.appendChild(child)
    else node.appendChild(document.createTextNode(child))
  }
  return node
}


//  Attach event handler to board
//
function attachEventHandler (board) {
  board.addEventListener("click", (e) => {
    // Ermittelt das angeklickte .field (auch wenn direkt auf ein .piece geklickt wurde)
    let field = e.target.closest(".field")
    if (!field) return

    let col = Number(field.getAttribute("data-col"))

    // Von unten nach oben nach dem untersten freien Feld suchen
    for (let row = 5; row >= 0; row--) {
      if (state.board[row][col] === '') {
        state.board[row][col] = state.next
        state.next = (state.next === 'r') ? 'b' : 'r'
        showBoard()
        return
      }
    }
  })
}

//  Get current state from server and re-draw board
//
function loadState () {
  fetch(SERVICE)
    .then(response => response.json())
    .then(data => {
      state = data
      showBoard()
    })

}

//  Put current state to server
//
function saveState () {
  fetch(SERVICE, {
    method: 'PUT',
    headers: { 'Content-type': 'application/json' },
    body: JSON.stringify(state)
  })
}

//  Reset game
//
function newGame () {
  state.board = [
    [ '', '', '', '', '', '', '' ],
    [ '', '', '', '', '', '', '' ],
    [ '', '', '', '', '', '', '' ],
    [ '', '', '', '', '', '', '' ],
    [ '', '', '', '', '', '', '' ],
    [ '', '', '', '', '', '', '' ]
  ]
  state.next = 'b'
  showBoard()
}

  </script>

</head>
<body>

  <div id="status">Turn: Blue</div>

  <div class="board"></div>
  
  <div class="controls">
    <button onclick="loadState()">Load</button>
    <button onclick="saveState()">Save</button>
    <button onclick="newGame()">New Game</button>
  </div>

  <script>
    initGame()
  </script>

</body>
</html>
